<style>
/* Layout: Figma frame logic. Grey wall, nav on top, catalogue centred.
   Every page is built from one grid in Figma units: spread 1050 × 754, pages 521 wide, spine 521–529,
   left page content x 32–494, right page content x 551–1019, folio at y 704. */
:root {
  --wall: #dcdcd9;
  --ink: #000000;
  --muted: #5d5d5a;
  --paper: #faf9f5;
  --serif: Georgia, "Times New Roman", serif;
  --sans: "Inter", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--wall);
  color: var(--ink);
  font-family: var(--sans);
  margin: 0;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  display: flex;
  flex-direction: column;
}
.nav { display: flex; justify-content: space-between; align-items: center; padding-top: 17px; height: 35px; box-sizing: border-box; flex: none; }
.nav button { font: 400 15px/18px var(--sans); color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; }
.nav button:hover { opacity: .55; }
button:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
.stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
.foot { flex: none; font: 400 9px/10px var(--sans); padding: 0 0 20px 3px; }

/* Book (all inner units are Figma px; the whole book is scaled with zoom) */
.book { position: relative; width: 1050px; height: 744px; perspective: 4200px; transition: transform .6s cubic-bezier(.4,0,.2,1); }
.clip { position: absolute; top: 0; overflow: hidden; }
.clip > .sp, .face > .sp { position: absolute; top: 0; }
.shadow { box-shadow: 0 12px 22px rgba(41,36,26,.18); }
.hit { position: absolute; top: 0; height: 100%; cursor: pointer; z-index: 20; }
.leaf { position: absolute; top: 0; left: 525px; height: 744px; transform-style: preserve-3d; transform-origin: 0 50%; z-index: 10; will-change: transform; }
.face { position: absolute; top: 0; height: 744px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.face.back { transform: rotateY(180deg); }
.shade { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 5; }
.face.front .shade { background: linear-gradient(90deg, rgba(40,34,24,.35), rgba(40,34,24,.1) 40%, rgba(40,34,24,0)); }
.face.back .shade { background: linear-gradient(270deg, rgba(40,34,24,.35), rgba(40,34,24,.1) 40%, rgba(40,34,24,0)); }

/* Spread chrome (from the Figma book) */
.sp { width: 1050px; height: 754px; }
.sp.single { width: 528px; }
.sp > * { position: absolute; }
.sp img.full { left: 0; top: 0; width: 100%; height: 100%; }
.sp img.pages { left: 0; top: 0; width: 1050px; height: 744px; }
.figcap { left: 551px; top: 693px; font: italic 400 10px/12px var(--sans); }
.wrap { left: 0; top: 0; width: 1050px; height: 754px; background: #c9c4b8; }
.inside { left: 0; top: 0; width: 1050px; height: 752px; background: #e5e1d7; }
.blockR { left: 525px; top: 2px; width: 525px; height: 748px; background: #dcd9d0; }
.blockL { left: 0; top: 2px; width: 525px; height: 748px; background: #dcd9d0; }
.edge { height: .45px; width: 521px; background: #c8c5bb; opacity: .4; }
.pageL { left: 0; top: 0; width: 521px; height: 744px; background: linear-gradient(270deg, #9d9586 0%, #b4ac9d 1%, #d8d2c6 3.5%, #ece8df 7.5%, #faf9f5 16%, #faf9f5 100%); }
.pageR { left: 529px; top: 0; width: 521px; height: 744px; background: linear-gradient(90deg, #9d9586 0%, #b4ac9d 1%, #d8d2c6 3.5%, #ece8df 7.5%, #faf9f5 16%, #faf9f5 100%); }
.spine { left: 521px; top: 0; width: 8px; height: 744px; background: linear-gradient(90deg, #b8b0a1 0%, #827969 40%, #827969 60%, #b8b0a1 100%); z-index: 3; }
.ad { left: 0; top: 0; width: 521px; height: 744px; }

/* Shared type */
.folio { top: 703px; font: 400 10px/12px var(--sans); }
.folio.l { left: 32px; }
.folio.r { left: 819px; width: 200px; text-align: right; }
.h1 { font: 400 50px/1 var(--serif); }
.rule { height: 1px; background: #000; }
.body { font: 400 12px/14.5px var(--sans); }
.body p { margin: 0 0 14.5px; }
.body p:last-child { margin-bottom: 0; }
.body b { font-weight: 700; }

/* Product page */
.p-title { left: 550px; top: 18px; }
.p-rule { left: 551px; top: 71px; width: 468px; }
.p-bottle { left: 551px; top: 91px; width: 190px; height: 270px; object-fit: cover; mix-blend-mode: multiply; }
.p-desc { left: 767px; top: 91px; width: 252px; }
.p-caprule { left: 551px; top: 381px; width: 468px; }
.p-cap { left: 551px; top: 385px; width: 468px; display: flex; justify-content: space-between; font: 400 10px/12px var(--sans); }
.p-labelbox { left: 551px; top: 404px; width: 468px; height: 294px; display: flex; align-items: center; justify-content: center; }
.p-labelbox img { mix-blend-mode: multiply; }

/* Section opener */
.op-word { left: 32px; top: 79px; font-family: var(--serif); font-weight: 400; line-height: 1.13; letter-spacing: 9px; white-space: nowrap; z-index: 4; }
.op-list { left: 32px; bottom: 53px; font: 400 14px/17px var(--sans); }

/* Contents */
.toc-n { font: 400 40px/28px var(--serif); }
.toc-t { font: 400 20px/20px var(--serif); white-space: nowrap; }
.toc-dp { width: 398px; display: flex; justify-content: space-between; align-items: flex-end; }
.toc-d { font: 400 10px/12px var(--sans); width: 240px; }
.toc-p { font: 400 10px/12px var(--sans); text-align: right; }

/* Back matter */
.form-row { display: flex; align-items: center; gap: 10px; font: 400 13px/16px var(--sans); }
.box { width: 11px; height: 11px; border: 1px solid #000; box-sizing: border-box; flex: none; }
.big-close { font: 400 50px/1.08 var(--serif); white-space: nowrap; }

/* Gallery */
.gallery { position: fixed; inset: 0; background: var(--wall); z-index: 50; overflow-y: auto; padding: calc(17px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.gallery .nav { padding-top: 0; margin-bottom: 40px; }
.grid { display: flex; flex-wrap: wrap; gap: 40px 28px; max-width: 1200px; margin: 0 auto; align-items: flex-end; }
.thumb { background: none; border: 0; padding: 0; cursor: pointer; display: flex; flex-direction: column; gap: 10px; font: 400 12px/14px var(--sans); color: var(--ink); text-align: left; }
.thumb .tb { position: relative; overflow: hidden; box-shadow: 0 8px 16px rgba(41,36,26,.18); transition: transform .2s ease; }
.thumb .tb > .sp { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.thumb:hover .tb { transform: translateY(-3px); }
.thumb span { color: var(--muted); }
/* Lightbox: click a bottle or label; scroll / pinch to zoom, drag to move, click outside to close */
.hit.zoom { cursor: zoom-in; }
.lb { position: fixed; inset: 0; z-index: 80; background: #ecebe7; overflow: hidden; touch-action: none; opacity: 0; transition: opacity .25s ease; }
.lb.on { opacity: 1; }
.lb img { position: absolute; left: 50%; top: 50%; max-width: calc(100vw - 80px); max-height: calc(100vh - 110px); transform-origin: 0 0; user-select: none; -webkit-user-drag: none; cursor: grab; }
.lb img.drag { cursor: grabbing; }
.lb-close { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); font: 400 13px/18px var(--sans); background: none; border: 0; cursor: pointer; color: var(--muted); padding: 4px; }
.lb-hint { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; font: 400 11px/14px var(--sans); color: var(--muted); pointer-events: none; }
/* Page arrows, only while the book is open */
.arrow { position: absolute; top: 352px; width: 36px; height: 50px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); opacity: 0; pointer-events: none; transition: opacity .45s ease; z-index: 30; display: flex; align-items: center; justify-content: center; }
.arrow.on { opacity: .75; pointer-events: auto; }
.arrow.on:hover { opacity: 1; }
.arrow.l { left: -52px; } .arrow.r { right: -52px; }
body.closed #startBtn svg { display: none; }
@media (prefers-reduced-motion: reduce) { .book, .thumb .tb, .lb, .arrow { transition: none; } }
</style>

<nav class="nav" aria-label="Catalogue">
  <button id="startBtn" type="button"><svg width="15" height="13" viewBox="0 0 15 13" fill="none" aria-hidden="true"><path d="M6.5 1L1 6.5L6.5 12M1 6.5H14.5" stroke="currentColor" stroke-width="1.2"/></svg>Start</button>
  <button id="galleryBtn" type="button">Gallery</button>
</nav>
